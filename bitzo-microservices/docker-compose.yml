name: VidBuxApp

x-app-environment: &app-environment
  NODE_ENV: production
  CORS_ORIGINS: "${CORS_ORIGINS:?Set CORS_ORIGINS to the comma-separated HTTPS frontend origins}"

x-app-defaults: &app-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  gateway:
    <<: *app-defaults
    build: ./gateway
    env_file: ./gateway/.env
    environment:
      <<: *app-environment
      PORT: "4000"
      AUTH_SERVICE_URL: http://auth-service:4001
      ADMIN_SERVICE_URL: http://admin-service:4002
      VIDEO_SERVICE_URL: http://video-service:4003
      CATEGORY_SERVICE_URL: http://category-service:4004
      LEADERBOARD_SERVICE_URL: http://leaderboard-service:4005
      NOTIFICATION_SERVICE_URL: http://notification-service:4006
      PLAYER_AD_SERVICE_URL: http://player-ad-service:4007
      COPYRIGHT_SERVICE_URL: http://copyright-service:4008
      SECURITY_SERVICE_URL: http://security-service:4009
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      category-service:
        condition: service_healthy
      leaderboard-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      player-ad-service:
        condition: service_healthy
      copyright-service:
        condition: service_healthy
      security-service:
        condition: service_healthy

  auth-service:
    <<: *app-defaults
    build: ./services/auth-service
    env_file: ./services/auth-service/.env
    environment:
      <<: *app-environment
      PORT: "4001"

  admin-service:
    <<: *app-defaults
    build: ./services/admin-service
    env_file: ./services/admin-service/.env
    environment:
      <<: *app-environment
      PORT: "4002"

  video-service:
    <<: *app-defaults
    build: ./services/video-service
    env_file: ./services/video-service/.env
    environment:
      <<: *app-environment
      PORT: "4003"

  category-service:
    <<: *app-defaults
    build: ./services/category-service
    env_file: ./services/category-service/.env
    environment:
      <<: *app-environment
      PORT: "4004"

  leaderboard-service:
    <<: *app-defaults
    build: ./services/leaderboard-service
    env_file: ./services/leaderboard-service/.env
    environment:
      <<: *app-environment
      PORT: "4005"

  notification-service:
    <<: *app-defaults
    build: ./services/notification-service
    env_file: ./services/notification-service/.env
    environment:
      <<: *app-environment
      PORT: "4006"

  player-ad-service:
    <<: *app-defaults
    build: ./services/player-ad-service
    env_file: ./services/player-ad-service/.env
    environment:
      <<: *app-environment
      PORT: "4007"

  copyright-service:
    <<: *app-defaults
    build: ./services/copyright-service
    env_file: ./services/copyright-service/.env
    environment:
      <<: *app-environment
      PORT: "4008"

  security-service:
    <<: *app-defaults
    build: ./services/security-service
    env_file: ./services/security-service/.env
    environment:
      <<: *app-environment
      PORT: "4009"
