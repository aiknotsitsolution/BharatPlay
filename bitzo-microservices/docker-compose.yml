name: VidBuxApp

x-app-environment: &app-environment
  NODE_ENV: production
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost,http://127.0.0.1}"

x-redis-environment: &redis-environment
  <<: *app-environment
  REDIS_URL: "redis://redis:6379/0"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in bitzo-microservices/.env}"

x-app-defaults: &app-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  redis:
    image: redis:7-alpine
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in bitzo-microservices/.env}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: BharatPlay Redis
      RI_REDIS_USERNAME: default
      RI_REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in bitzo-microservices/.env}"
      RI_ENCRYPTION_KEY: "${RI_ENCRYPTION_KEY:-}"
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy

  web:
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: ../bitzo-website
      dockerfile: Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    <<: *app-defaults
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file: ./gateway/.env
    environment:
      <<: *app-environment
      PORT: "5000"
      AUTH_SERVICE_URL: http://auth-service:5001
      ADMIN_SERVICE_URL: http://admin-service:5002
      VIDEO_SERVICE_URL: http://video-service:5003
      CATEGORY_SERVICE_URL: http://category-service:5004
      LEADERBOARD_SERVICE_URL: http://leaderboard-service:5005
      NOTIFICATION_SERVICE_URL: http://notification-service:5006
      PLAYER_AD_SERVICE_URL: http://player-ad-service:5007
      COPYRIGHT_SERVICE_URL: http://copyright-service:5008
      SECURITY_SERVICE_URL: http://security-service:5009
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    depends_on:
      auth-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      category-service:
        condition: service_healthy
      leaderboard-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      player-ad-service:
        condition: service_healthy
      copyright-service:
        condition: service_healthy
      security-service:
        condition: service_healthy

  auth-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: ./services/auth-service/.env
    environment:
      <<: *redis-environment
      PORT: "5001"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-2}"
    depends_on:
      redis:
        condition: service_healthy

  admin-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    env_file: ./services/admin-service/.env
    environment:
      <<: *redis-environment
      PORT: "5002"
    depends_on:
      redis:
        condition: service_healthy

  video-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/video-service/Dockerfile
    env_file: ./services/video-service/.env
    environment:
      <<: *redis-environment
      PORT: "5003"
    depends_on:
      redis:
        condition: service_healthy

  category-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/category-service/Dockerfile
    env_file: ./services/category-service/.env
    environment:
      <<: *redis-environment
      PORT: "5004"
    depends_on:
      redis:
        condition: service_healthy

  leaderboard-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/leaderboard-service/Dockerfile
    env_file: ./services/leaderboard-service/.env
    environment:
      <<: *app-environment
      PORT: "5005"

  notification-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file: ./services/notification-service/.env
    environment:
      <<: *redis-environment
      PORT: "5006"
      BULL_BOARD_USER: "${BULL_BOARD_USER:-admin}"
      BULL_BOARD_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in bitzo-microservices/.env}"
    ports:
      - "127.0.0.1:5541:5006"
    depends_on:
      redis:
        condition: service_healthy

  player-ad-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/player-ad-service/Dockerfile
    env_file: ./services/player-ad-service/.env
    environment:
      <<: *app-environment
      PORT: "5007"

  copyright-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/copyright-service/Dockerfile
    env_file: ./services/copyright-service/.env
    environment:
      <<: *redis-environment
      PORT: "5008"
    depends_on:
      redis:
        condition: service_healthy

  security-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/security-service/Dockerfile
    env_file: ./services/security-service/.env
    environment:
      <<: *app-environment
      PORT: "5009"

volumes:
  redis-data:
  redis-insight-data:
